development:
  adapter: sqlite3
  database: db/backyarder-development

test:
  adapter: sqlite3
  database: db/backyarder-test

# Production connects via the DATABASE_URL environment variable (e.g. a Neon
# Postgres connection string). sinatra-activerecord merges that URL into this
# entry automatically, so no credentials belong in this file.
production:
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("DB_POOL", 5) %>
